spring.application.name=api-gateway

server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:public.pem

spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=job-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://job-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/job/**

spring.cloud.gateway.server.webmvc.routes[2].id=application-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://application-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/application/**

spring.cloud.gateway.server.webmvc.routes[3].id=auth-admin-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/admin/**

spring.cloud.gateway.server.webmvc.routes[4].id=profile-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://profile-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/profile/**